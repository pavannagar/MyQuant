services:
  - type: web
    name: coinswitch-scanner
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COINSWITCH_API_KEY
        sync: false
      - key: COINSWITCH_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LIVE_TRADING
        value: "0"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: "pavannagar/MyQuant"
      - key: GITHUB_BRANCH
        value: "main"
